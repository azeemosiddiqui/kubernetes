
###***NAMESPACE.YAML***###
apiVersion: v1
kind: Namespace
metadata:
  name: prod                         # Application namespace

---
###***SERVICEACCOUNT.YAML***###
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-azure-sa                 # Identity used by ESO for Azure access
  namespace: prod
  annotations:
    azure.workload.identity/client-id: "<AZURE_MANAGED_IDENTITY_CLIENT_ID>"
    # Client ID of the Azure User Assigned Managed Identity

    azure.workload.identity/tenant-id: "<AZURE_TENANT_ID>"
    # Microsoft Entra tenant ID

---
###***SECRETSTORE.YAML***###
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: azure-secret-store
  namespace: prod
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity       # Authenticate using Azure Workload Identity

      vaultUrl: "https://<KEY_VAULT_NAME>.vault.azure.net"
      # Azure Key Vault URL

      serviceAccountRef:
        name: eso-azure-sa             # ServiceAccount used for Azure authentication

---
###***EXTERNALSECRET.YAML***###
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nginx-external-secret
  namespace: prod
spec:
  refreshInterval: 1h                  # Check Azure Key Vault every 1 hour

  secretStoreRef:
    name: azure-secret-store           # SecretStore to use
    kind: SecretStore                  # Namespaced SecretStore

  target:
    name: nginx-secret                 # Kubernetes Secret to create
    creationPolicy: Owner              # ExternalSecret manages this Secret

  data:
  - secretKey: DB_USERNAME              # Key inside Kubernetes Secret
    remoteRef:
      key: prod-db-username             # Secret name inside Azure Key Vault

  - secretKey: DB_PASSWORD
    remoteRef:
      key: prod-db-password             # Another secret name in Key Vault

---
###***DEPLOYMENT.YAML***###
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx

    spec:
      containers:
      - name: nginx-container
        image: nginx:latest
        ports:
        - containerPort: 80

        env:
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: nginx-secret
              key: DB_USERNAME

        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nginx-secret
              key: DB_PASSWORD
##################
---------------------------------------
Key Vault secret name  | 	Secret value
---------------------------------------
prod-db-username	     |  admin
prod-db-password	     |  mypassword123
----------------------------------------
##############################################
Azure mein apply karne se pehle kya configure karna hai?
1. AKS cluster par OIDC issuer aur Workload Identity enabled hone chahiye.
2. User Assigned Managed Identity create karo.
3. Managed Identity ko Key Vault par Key Vault Secrets User role assign karo (RBAC enabled vault ke liye).
4. Federated Identity Credential create karo, jisme:
   - Issuer = AKS OIDC issuer URL.
   - Subject = system:serviceaccount:prod:eso-azure-sa
   - Audience = api://AzureADTokenExchange.
5. YAML mein actual Client ID, Tenant ID aur Key Vault URL fill karo.
Azure ESO integration mein authType: WorkloadIdentity aur serviceAccountRef se authentication configure hoti hai.


#################
kubectl apply -f external-secret-azure.yaml

kubectl get secretstore -n prod
kubectl get externalsecret -n prod
kubectl describe externalsecret nginx-external-secret -n prod
kubectl get secret nginx-secret -n prod
kubectl get pods -n prod

### Check in container env values
kubectl exec -it -n prod deployment/nginx-deployment -- printenv DB_USERNAME
kubectl exec -it -n prod deployment/nginx-deployment -- printenv DB_PASSWORD
