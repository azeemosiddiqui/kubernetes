
# =====================================================
# 1. NAMESPACE
# =====================================================

apiVersion: v1                 # Kubernetes API version
kind: Namespace                # We are creating a Namespace
metadata:                      # Metadata means information about this object
  name: demo                   # Namespace name is demo

---
# --- separates one Kubernetes object from another ---


# =====================================================
# 2. SERVICE ACCOUNT
# =====================================================

apiVersion: v1                 # ServiceAccount uses core API version v1
kind: ServiceAccount            # We are creating a ServiceAccount
metadata:
  name: app-sa                 # Name of our ServiceAccount
  namespace: demo              # Create it inside demo namespace

# ServiceAccount gives an identity to a Pod.
# Think of it like an ID card for a person.


---
# =====================================================
# 3. ROLE
# =====================================================

apiVersion: rbac.authorization.k8s.io/v1  # RBAC API version
kind: Role                                # We are creating a Role
metadata:
  name: app-role                          # Name of this Role
  namespace: demo                         # Role works inside demo namespace

rules:                                    # Rules define allowed permissions
  - apiGroups: [""]                       # Empty string means core API group
    resources:                            # Which Kubernetes resources can be accessed
      - pods                              # Permission applies to Pods
      - configmaps                        # Permission also applies to ConfigMaps
    verbs:                                # What actions are allowed
      - get                               # Read one specific resource
      - list                              # List multiple resources
      - watch                             # Watch resource changes

# This Role allows reading Pods and ConfigMaps.
# It does NOT allow creating, updating or deleting them.


---
# =====================================================
# 4. ROLE BINDING
# =====================================================

apiVersion: rbac.authorization.k8s.io/v1  # RBAC API version
kind: RoleBinding                         # We are creating a RoleBinding
metadata:
  name: app-rolebinding                   # Name of RoleBinding
  namespace: demo                         # Binding is inside demo namespace

subjects:                                 # WHO will receive permissions?
  - kind: ServiceAccount                  # The subject is a ServiceAccount
    name: app-sa                           # Give permissions to app-sa
    namespace: demo                        # This ServiceAccount belongs to demo

roleRef:                                  # WHICH ROLE will be assigned?
  apiGroup: rbac.authorization.k8s.io     # API group where Role exists
  kind: Role                              # We are referring to a Role
  name: app-role                          # Assign app-role permissions

# RoleBinding connects app-sa with app-role.
# In simple words: Give app-sa the permissions of app-role.


---
# =====================================================
# 5. POD
# =====================================================

apiVersion: v1                           # Pod uses core API version v1
kind: Pod                                # We are creating a Pod
metadata:
  name: app-pod                          # Name of the Pod
  namespace: demo                        # Pod will run in demo namespace

spec:                                    # Specification means Pod configuration

  serviceAccountName: app-sa             # Use app-sa as this Pod's identity

  automountServiceAccountToken: true     # Mount the ServiceAccount API token
                                          # into the Pod so it can authenticate
                                          # to the Kubernetes API server

  containers:                            # List of containers inside the Pod
    - name: nginx                        # Container name is nginx
      image: nginx:latest                 # Download and run nginx image
      ports:
        - containerPort: 80              # Nginx listens on port 80

# This Pod uses app-sa.
# app-sa receives permissions from app-role through RoleBinding.
# Therefore, the Pod can read Pods and ConfigMaps in demo namespace
# when it authenticates to the Kubernetes API.

