
###***NAMESPACE.YAML***###
apiVersion: v1
kind: Namespace
metadata:
  name: prod                         # Application namespace

---
###***SERVICEACCOUNT.YAML***###
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-aws-sa                   # Identity used by ESO to access AWS
  namespace: prod
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/eso-aws-secrets-role"
    # IAM role ARN; replace with your actual IAM role ARN
    # Role trust policy must trust this EKS service account

---
###***SECRETSTORE.YAML***###
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secret-store
  namespace: prod
spec:
  provider:
    aws:
      service: SecretsManager        # External provider is AWS Secrets Manager
      region: us-east-1               # AWS region where secret exists
      auth:
        jwt:
          serviceAccountRef:
            name: eso-aws-sa         # ESO uses this SA to authenticate to AWS

---
###***EXTERNALSECRET.YAML***###
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nginx-external-secret
  namespace: prod
spec:
  refreshInterval: 1h                 # Check external secret every 1 hour

  secretStoreRef:
    name: aws-secret-store            # SecretStore to use
    kind: SecretStore                 # Namespaced SecretStore

  target:
    name: nginx-secret                # Kubernetes Secret to create
    creationPolicy: Owner             # ExternalSecret manages this Secret

  data:
  - secretKey: DB_USERNAME             # Key to create inside Kubernetes Secret
    remoteRef:
      key: prod/database              # AWS Secrets Manager secret name
      property: username              # JSON property to fetch

  - secretKey: DB_PASSWORD             # Another key inside Kubernetes Secret
    remoteRef:
      key: prod/database              # Same AWS secret
      property: password              # Fetch password property

---
###***DEPLOYMENT.YAML***###
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx

    spec:
      containers:
      - name: nginx-container
        image: nginx:latest
        ports:
        - containerPort: 80

        env:
        - name: DB_USERNAME              # Container environment variable
          valueFrom:
            secretKeyRef:
              name: nginx-secret        # Kubernetes Secret created by ESO
              key: DB_USERNAME          # Key inside that Secret

        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nginx-secret
              key: DB_PASSWORD
              
######################
AWS Secrets Manager mein ek secret create karna:
Secret name: prod/database
Secret value (JSON):
{
  "username": "admin",
  "password": "mypassword123"
}

####AWS mein apply karne se pehle kya configure karna hai?
AWS mein apply karne se pehle kya configure karna hai?
1. EKS cluster ka OIDC provider IAM mein associate hona chahiye.
2. IAM role eso-aws-secrets-role create karna hai.
3. IAM trust policy mein ye ServiceAccount identity trust honi chahiye:
system:serviceaccount:prod:eso-aws-sa


4. IAM role ko Secrets Manager read permissions do:
   - secretsmanager:GetSecretValue
   - secretsmanager:DescribeSecret
   Agar secret customer-managed KMS key se encrypted hai, toh required KMS decrypt permission bhi do.
5. arn:aws:iam::123456789012:role/eso-aws-secrets-role ko apne actual role ARN se replace karna hai.
AWS SecretStore mein jwt.serviceAccountRef isi ServiceAccount ko reference karta hai.

###***Interview***###
"External Secrets Operator integrates Kubernetes with external secret management platforms such as AWS Secrets Manager and Azure Key Vault. 
First, we create a SecretStore to configure the connection and authentication with the external provider. Then we create an ExternalSecret 
object that defines which external secrets and properties need to be fetched. The ESO controller continuously watches the ExternalSecret resource, 
fetches the values from the external provider, and creates or updates a native Kubernetes Secret. Finally, our application Pods consume 
that Kubernetes Secret using secretKeyRef or volume mounts. This way, we don't need to store actual credentials in our application Deployment YAML 
or Git repository."

Ek important point: SecretStore aur ExternalSecret Kubernetes ke built-in objects nahi hain. Ye External Secrets Operator (ESO) install karne 
ke baad available hote hain. ESO controller in objects ko watch karta hai aur actual Kubernetes Secret create/update karta hai.

"External Secrets Operator integrates Kubernetes with external secret management systems like AWS Secrets Manager, Azure Key Vault and HashiCorp Vault. 
SecretStore defines the connection and authentication configuration, while ExternalSecret defines which external secret values should be fetched and
how they should be mapped into a Kubernetes Secret. The application then consumes that Kubernetes Secret using secretKeyRef or volume mounts."
