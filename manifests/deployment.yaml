apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: prod
  labels:
    app: my-deploy
    env: prod

spec:
  replicas: 2

  selector:
    matchLabels:
      app: nginx
      env: prod

  template:
    metadata:
      namespace: prod
      labels:
        app: nginx
        env: prod
    spec:
      containers:
      - name: nginx-container
        image: nginx:latest
        ports:
        - containerPort: 80
